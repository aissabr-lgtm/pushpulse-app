workflows:
  python-android-apk:
    name: Build Python Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade pip
          pip install --upgrade Cython setuptools
          pip install --upgrade --force-reinstall git+https://github.com/kivy/python-for-android.git
          pip install --upgrade --force-reinstall git+https://github.com/kivy/buildozer.git
      - name: Build APK with Buildozer
        script: |
          buildozer android debug
    artifacts:
      - bin/*.apk
